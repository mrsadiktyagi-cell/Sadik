name: sadik
description: AI app creator with budgeting and savings goal tracking.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & State Management
  provider: ^6.0.0
  get: ^4.6.5
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  hive: ^2.2.3
  
  # Cloud (Firebase)
  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  
  # UI Components
  material_design_icons_flutter: ^7.0.7296
  shimmer: ^3.0.0
  fl_chart: ^0.65.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.0
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
